# Spezifisch: Roboter-Geometrie, Geschwindigkeitslimits, Sensorik, Collision-Monitor-Zonen.
# Wird NACH nav2_params_common.yaml geladen und überschreibt dort gleiche Parameter.

controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.5
      max_angular_vel: 1.0
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      max_allowed_time_to_collision_up_to_carrot: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      width: 3
      height: 3
      robot_radius: 0.22
      inflation_layer:
        inflation_radius: 0.55
      obstacle_layer:
        observation_sources: lidar
        lidar:
          topic: /lidar/pointcloud
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_max_range: 5.0
          obstacle_min_range: 0.1
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          min_obstacle_height: 0.05
          max_obstacle_height: 1.5

global_costmap:
  global_costmap:
    ros__parameters:
      width: 20
      height: 20
      robot_radius: 0.22
      inflation_layer:
        inflation_radius: 0.55
      obstacle_layer:
        observation_sources: lidar
        lidar:
          topic: /lidar/pointcloud
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_max_range: 8.0
          obstacle_min_range: 0.1
          raytrace_max_range: 9.0
          raytrace_min_range: 0.0
          min_obstacle_height: 0.05
          max_obstacle_height: 1.5

behavior_server:
  ros__parameters:
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    deadband_velocity: [0.0, 0.0, 0.0]

collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_nav
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    polygons: ["PolygonStop"]
    PolygonStop:
      type: polygon
      points: [0.35, 0.3, 0.35, -0.3, -0.35, -0.3, -0.35, 0.3]
      action_type: stop
      min_points: 4
      visualize: true
      enabled: true
    observation_sources: ["pointcloud"]
    pointcloud:
      type: pointcloud
      topic: /lidar/pointcloud
      min_height: 0.1
      max_height: 1.5
      enabled: true