/**:
  ros__parameters:
    fps: 15

    # Color stream settings.
    color_resolution: 1920x1080
    camera_back.color.image_raw.ffmpeg.encoder: h264_nvmpi
    camera_back.color.image_raw.ffmpeg.gop_size: 1
    camera_back.color.image_raw.ffmpeg.bit_rate: 3000000
    camera_back.color.image_raw.ffmpeg.encoder_av_options: profile:high,preset:ultrafast
    camera_back.color.image_raw.enable_pub_plugins:
      - image_transport/ffmpeg
      - image_transport/raw

    # Depth stream settings.
    depth_resolution: 1280x720
    .camera_back.depth.image_raw.compressedDepth.format: rvl
    camera_back.depth.image_raw.enable_pub_plugins:
      - image_transport/compressedDepth
      - image_transport/raw
